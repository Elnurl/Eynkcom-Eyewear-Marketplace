# Render Blueprint: one Node web service (API + storefront) and a Postgres database.
# Dashboard → New → Blueprint → pick this repository. Values marked `sync: false`
# are prompted for on first apply and never stored in git.
services:
  - type: web
    name: eynek-marketplace
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    # NODE_ENV is set only at runtime; at build time it would make pnpm skip the
    # devDependencies (vite, esbuild, typescript) that the build needs.
    buildCommand: npm install -g pnpm@11.7.0 && pnpm install --frozen-lockfile && pnpm run build
    startCommand: NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: eynek-db
          property: connectionString
      - key: MARKETPLACE_ADMIN_EMAIL
        value: hmdzadelnur@gmail.com
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # Only for a Clerk production instance: https://xn--eynk-x6b.com/api/__clerk
      - key: VITE_CLERK_PROXY_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto

databases:
  - name: eynek-db
    region: frankfurt
    plan: basic-256mb
    databaseName: eynek
    user: eynek
    postgresMajorVersion: "16"
