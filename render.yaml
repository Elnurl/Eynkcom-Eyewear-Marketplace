# Render Blueprint: one Node web service (API + storefront) and a Postgres database.
# Dashboard → New → Blueprint → pick this repository. Values marked `sync: false`
# are prompted for on first apply and never stored in git.
services:
  - type: web
    name: eynek-marketplace
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    # NODE_ENV is set only at runtime; at build time it would make pnpm skip the
    # devDependencies (vite, esbuild, typescript) that the build needs.
    buildCommand: npm install -g pnpm@11.7.0 && pnpm install --frozen-lockfile && pnpm run build
    startCommand: NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: eynek-db
          property: connectionString
      - key: MARKETPLACE_ADMIN_EMAIL
        value: hmdzadelnur@gmail.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://xn--eynk-x6b.com
      - key: AUTH_TRUSTED_ORIGINS
        value: https://www.xn--eynk-x6b.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "EYNƏK.com <no-reply@xn--eynk-x6b.com>"
      # Optional Google sign-in; set VITE_GOOGLE_SIGN_IN=true once both are filled in
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: VITE_GOOGLE_SIGN_IN
        value: "false"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto

databases:
  - name: eynek-db
    region: frankfurt
    plan: basic-256mb
    databaseName: eynek
    user: eynek
    postgresMajorVersion: "16"
