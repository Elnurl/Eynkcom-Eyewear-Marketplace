openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Public catalog products
  - name: seller-products
    description: Approved seller product management and catalog moderation
  - name: seller-applications
    description: Seller applications and marketplace review
  - name: stores
    description: Public seller stores and seller store management
  - name: Auth
    description: Browser authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: orders
    description: Guest checkout, buyer order tracking, and seller fulfillment
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /checkout/options:
    get:
      operationId: getCheckoutOptions
      tags: [orders]
      summary: List currently available checkout methods
      responses:
        "200":
          description: Checkout configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutOptions"
  /orders:
    post:
      operationId: createGuestOrder
      tags: [orders]
      summary: Place one guest order across multiple sellers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestOrderInput"
      responses:
        "200":
          description: Existing order returned for an idempotent checkout retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerOrder"
        "201":
          description: Order received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerOrder"
        "400":
          description: Invalid checkout details or unavailable products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Stock changed before checkout completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Selected payment method is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{orderId}:
    get:
      operationId: getGuestOrder
      tags: [orders]
      summary: View an order using its buyer access token
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: X-Order-Access-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "200":
          description: Order and Azerbaijani status timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerOrder"
        "404":
          description: Order not found or access token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{orderId}/decision:
    post:
      operationId: decideGuestOrderRevision
      tags: [orders]
      summary: Accept a seller-adjusted order or cancel it
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: X-Order-Access-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyerOrderDecision"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerOrder"
        "400":
          description: Decision is not available in the current order state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order not found or access token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /seller/orders:
    get:
      operationId: listSellerOrders
      tags: [orders]
      summary: List orders for the authenticated seller's shop
      responses:
        "200":
          description: Seller-scoped order groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerOrder"
        "401":
          description: Authentication required
        "403":
          description: Approved seller access required
  /seller/orders/{id}:
    patch:
      operationId: updateSellerOrder
      tags: [orders]
      summary: Confirm or update delivery for the authenticated seller's order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerOrderUpdate"
      responses:
        "200":
          description: Updated seller order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerOrder"
        "400":
          description: Invalid order update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
        "403":
          description: Approved seller access required
        "404":
          description: Seller order not found
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [orders]
      summary: List marketplace orders for the configured administrator
      responses:
        "200":
          description: Orders with settlement and refund totals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrder"
        "401":
          description: Authentication required
        "403":
          description: Marketplace administrator access required
        "503":
          description: Marketplace administrator is not configured
  /admin/orders/{id}/refund:
    patch:
      operationId: recordOrderRefund
      tags: [orders]
      summary: Record a refund after it has been verified by the administrator
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRefundInput"
      responses:
        "200":
          description: Refund and seller commission recalculated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "400":
          description: Refund is invalid for this order or exceeds the refundable amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
        "403":
          description: Marketplace administrator access required
        "404":
          description: Order not found
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List active products
      description: Returns active seller products for the public catalog.
      responses:
        "200":
          description: Active products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProduct"
  /seller/products:
    get:
      operationId: listSellerProducts
      tags: [seller-products]
      summary: List seller products
      description: Returns all products for the authenticated approved seller.
      responses:
        "200":
          description: Seller products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerProduct"
    post:
      operationId: createSellerProduct
      tags: [seller-products]
      summary: Create a seller product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProduct"
        "400":
          description: Invalid product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /seller/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    patch:
      operationId: updateSellerProduct
      tags: [seller-products]
      summary: Update a seller product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProduct"
        "400":
          description: Invalid product update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSellerProduct
      tags: [seller-products]
      summary: Delete a seller product
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stores:
    get:
      operationId: listStores
      tags: [stores]
      summary: List public approved stores
      responses:
        "200":
          description: Public stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerStore"
  /seller/store:
    get:
      operationId: getSellerStore
      tags: [stores]
      summary: Get the authenticated seller's approved store
      responses:
        "200":
          description: Seller store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerStore"
        "401":
          description: Authentication required
        "403":
          description: Seller approval required
    patch:
      operationId: updateSellerStore
      tags: [stores]
      summary: Update the authenticated seller's store profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerStoreUpdate"
      responses:
        "200":
          description: Store updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerStore"
        "400":
          description: Invalid store update
        "401":
          description: Authentication required
        "403":
          description: Seller approval required
  /seller/applications:
    post:
      operationId: createSellerApplication
      tags: [seller-applications]
      summary: Submit a seller application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerApplicationInput"
      responses:
        "201":
          description: Application received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerApplication"
        "400":
          description: Invalid application
  /seller/applications/mine:
    get:
      operationId: listMySellerApplications
      tags: [seller-applications]
      summary: List applications matching the authenticated user's email
      responses:
        "200":
          description: The current user's applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerApplication"
        "401":
          description: Authentication required
  /admin/seller-applications:
    get:
      operationId: listAdminSellerApplications
      tags: [seller-applications]
      summary: List seller applications for review
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SellerApplicationStatus"
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerApplication"
        "401":
          description: Authentication required
        "403":
          description: Marketplace administrator access required
        "503":
          description: Marketplace administrator is not configured
  /admin/seller-applications/{id}:
    patch:
      operationId: reviewSellerApplication
      tags: [seller-applications]
      summary: Review a seller application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerApplicationReview"
      responses:
        "200":
          description: Application reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerApplication"
        "400":
          description: Invalid review
        "401":
          description: Authentication required
        "403":
          description: Marketplace administrator access required
        "404":
          description: Application not found
        "503":
          description: Marketplace administrator is not configured
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [seller-products]
      summary: List products for marketplace moderation
      parameters:
        - name: approvalStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProductApprovalStatus"
      responses:
        "200":
          description: Products for review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerProduct"
        "401":
          description: Authentication required
        "403":
          description: Marketplace administrator access required
        "503":
          description: Marketplace administrator is not configured
  /admin/products/{id}/approval:
    patch:
      operationId: reviewSellerProduct
      tags: [seller-products]
      summary: Approve or reject a seller product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductApprovalUpdate"
      responses:
        "200":
          description: Product moderation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProduct"
        "400":
          description: Invalid moderation update
        "401":
          description: Authentication required
        "403":
          description: Marketplace administrator access required
        "404":
          description: Product not found
        "503":
          description: Marketplace administrator is not configured
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the authorization endpoint
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser login flow
      responses:
        "302":
          description: Redirect to the requested app path
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the browser session
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect after logout
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for direct file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/complete:
    post:
      tags: [Storage]
      operationId: completeUpload
      summary: Finalize an uploaded object and assign ownership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCompleteRequest"
      responses:
        "200":
          description: Upload finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCompleteResponse"
        "400":
          description: Invalid object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to finalize upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public storage asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded product object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SellerProduct:
      type: object
      required:
        - id
        - sellerId
        - name
        - category
        - price
        - stock
        - color
        - material
        - brand
        - gender
        - shape
        - size
        - description
        - status
        - approvalStatus
        - moderationNote
        - frontImage
        - sideImage
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        sellerId:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [Optik çərçivə, Gün eynəyi]
        price:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
        color:
          type: string
        material:
          type: string
        brand:
          type: string
        gender:
          type: string
          enum: [Qadın, Kişi, Uniseks]
        shape:
          type: string
          enum: [Aviator, Cat-Eye, Rectangle, Round, Square, Wayfarer]
        size:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [Aktiv, Qaralama]
        approvalStatus:
          $ref: "#/components/schemas/ProductApprovalStatus"
        moderationNote:
          type: ["string", "null"]
        frontImage:
          type: string
        sideImage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SellerProductInput:
      type: object
      required:
        - name
        - category
        - price
        - stock
        - color
        - material
        - brand
        - gender
        - shape
        - size
        - description
        - status
        - frontImage
        - sideImage
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        category:
          type: string
          enum: [Optik çərçivə, Gün eynəyi]
        price:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
        color:
          type: string
          minLength: 1
          maxLength: 100
        material:
          type: string
          minLength: 1
          maxLength: 100
        brand:
          type: string
          maxLength: 100
        gender:
          type: string
          enum: [Qadın, Kişi, Uniseks]
        shape:
          type: string
          enum: [Aviator, Cat-Eye, Rectangle, Round, Square, Wayfarer]
        size:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 1000
        status:
          type: string
          enum: [Aktiv, Qaralama]
        frontImage:
          type: string
          minLength: 1
        sideImage:
          type: string
          minLength: 1
    SellerProductUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        category:
          type: string
          enum: [Optik çərçivə, Gün eynəyi]
        price:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
        color:
          type: string
          minLength: 1
          maxLength: 100
        material:
          type: string
          minLength: 1
          maxLength: 100
        brand:
          type: string
          maxLength: 100
        gender:
          type: string
          enum: [Qadın, Kişi, Uniseks]
        shape:
          type: string
          enum: [Aviator, Cat-Eye, Rectangle, Round, Square, Wayfarer]
        size:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 1000
        status:
          type: string
          enum: [Aktiv, Qaralama]
        frontImage:
          type: string
          minLength: 1
        sideImage:
          type: string
          minLength: 1
    ProductApprovalStatus:
      type: string
      enum: [pending, approved, rejected, needs_changes]
    ProductApprovalUpdate:
      type: object
      required: [approvalStatus]
      properties:
        approvalStatus:
          type: string
          enum: [approved, rejected, needs_changes]
        moderationNote:
          type: ["string", "null"]
          maxLength: 1000
    PublicProduct:
      type: object
      required: [id, sellerId, name, category, price, stock, color, material, brand, gender, shape, size, description, frontImage, sideImage, vendor, vendorSlug, location, isAvailable]
      properties:
        id:
          type: string
        sellerId:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [Optik çərçivə, Gün eynəyi]
        price:
          type: integer
        stock:
          type: integer
          minimum: 0
        color:
          type: string
        material:
          type: string
        brand:
          type: string
        gender:
          type: string
          enum: [Qadın, Kişi, Uniseks]
        shape:
          type: string
          enum: [Aviator, Cat-Eye, Rectangle, Round, Square, Wayfarer]
        size:
          type: string
        description:
          type: string
        frontImage:
          type: string
        sideImage:
          type: string
        vendor:
          type: string
        vendorSlug:
          type: string
        location:
          type: string
        isAvailable:
          type: boolean
    SellerStore:
      type: object
      required: [id, name, slug, location, description, instagram, website, status, productCount, initials, since, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        location:
          type: string
        description:
          type: string
        instagram:
          type: string
        website:
          type: string
        status:
          type: string
          enum: [active, inactive]
        productCount:
          type: integer
          minimum: 0
        initials:
          type: string
        since:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SellerStoreUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        location:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 1000
        instagram:
          type: string
          maxLength: 200
        website:
          type: string
          maxLength: 300
    SellerApplicationStatus:
      type: string
